name: lese_app
description: Kasem Lese App – zählt gelesene Wörter pro Minute, speichert in Firebase und schaltet Belohnungen frei.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  speech_to_text: ^7.0.0
  crypto: ^3.0.5
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/kasem.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FFD23F"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 23
