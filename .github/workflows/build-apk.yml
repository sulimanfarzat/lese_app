name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Gerüst erzeugen
        run: |
          flutter create --platforms=android --org io.farzat --project-name lese_app .
          rm -rf test   # Beispieltest von flutter create passt nicht zur App
          cp android_setup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp google-services.json android/app/google-services.json

      - name: minSdk, Paketname und festen Signaturschlüssel setzen
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App-Symbol (Echse) erzeugen
        run: dart run flutter_launcher_icons

      - name: Code prüfen
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Kleine APKs pro Prozessor-Typ bauen
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk kasem-lese-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk kasem-lese-app-alt-32bit.apk

      - name: Universal-APK bauen (läuft auf allen Geräten)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk kasem-lese-app.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kasem-lese-app-apk
          path: '*.apk'

      - name: Als Release veröffentlichen (Download-Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kasem Lese App Build ${{ github.run_number }}
          body: |
            - **kasem-lese-app-arm64.apk** – empfohlen, klein, für fast alle Handys ab ca. 2017
            - **kasem-lese-app.apk** – universell, falls die kleine nicht installiert werden kann
            - **kasem-lese-app-alt-32bit.apk** – nur für sehr alte Handys
          files: |
            kasem-lese-app-arm64.apk
            kasem-lese-app.apk
            kasem-lese-app-alt-32bit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
