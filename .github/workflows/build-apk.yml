name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Gerüst erzeugen
        run: |
          flutter create --platforms=android --org io.farzat --project-name lese_app .
          cp android_setup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: minSdk + Paketname aus google-services.json setzen
        run: |
          PKG=$(python3 -c "import json;print(json.load(open('google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")
          echo "Paketname: $PKG"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 23/" "$f"
            sed -i -E "s/applicationId *=? *\"[^\"]+\"/applicationId = \"$PKG\"/" "$f"
            grep -nE "minSdk|applicationId" "$f"
          done
          cp google-services.json android/app/google-services.json

      - run: flutter pub get

      - name: Kleine APKs pro Prozessor-Typ bauen
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk lese-trainer-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk lese-trainer-alt-32bit.apk

      - name: Universal-APK bauen (läuft auf allen Geräten)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk lese-trainer.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lese-trainer-apk
          path: '*.apk'

      - name: Als Release veröffentlichen (Download-Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lese-Trainer Build ${{ github.run_number }}
          body: |
            - **lese-trainer-arm64.apk** – empfohlen, klein, für fast alle Handys ab ca. 2017
            - **lese-trainer.apk** – universell, falls die kleine nicht installiert werden kann
            - **lese-trainer-alt-32bit.apk** – nur für sehr alte Handys
          files: |
            lese-trainer-arm64.apk
            lese-trainer.apk
            lese-trainer-alt-32bit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
